[package]
name = "elem-simd-math"
version = "0.1.2"
edition = "2021"
rust-version = "1.89"
license = "(MIT OR Apache-2.0) AND BSL-1.0"
repository = "https://github.com/tensor4all/elem-simd-math-rs"
description = "Vectorized elementwise math kernels for f32/f64 over stable-Rust SIMD (port of SLEEF via sleef-rs, on fearless_simd)."
keywords = ["simd", "math", "libm", "sleef"]
categories = ["mathematics", "science"]
readme = "README.md"

[dependencies]
fearless_simd = "1.1"

[dev-dependencies]
# MPFR oracle for the ULP tests.
rug = { version = "1.24", default-features = false, features = ["float"] }
# Pure-Rust libm, used as the portable comparison arm in `benches/portable_libm.rs`.
libm = "0.2"

[features]
default = ["simd"]
# Enables the runtime-dispatched SIMD kernels. Without it every entry point uses
# the scalar fallback implementation.
simd = []

[lib]
bench = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "portable_libm"
harness = false

[profile.dev]
debug = 0

[profile.test]
debug = 0

# `cargo bench` uses the `bench` profile, which inherits from `release`. Keep it identical to
# `release` so that the benchmark measures the same code the release build produces.
[profile.release]
debug = 0

[profile.bench]
debug = 0
